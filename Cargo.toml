[package]
name = "armature-acme"
version = "0.5.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-acme"
homepage = "https://quinnjr.github.io/armature"
description = "ACME protocol support for automatic TLS certificates in Armature"
keywords = ["acme", "tls", "certificates", "letsencrypt"]
categories = ["web-programming", "cryptography"]

[dependencies]
armature-core = { version = "0.11" }

# Async runtime
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"

# HTTP client for ACME protocol
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }

# Cryptography
rustls = "0.23.45"
# PEM parsing (replaces the unmaintained rustls-pemfile, RUSTSEC-2025-0134)
rustls-pki-types = { version = "1.12", features = ["std"] }
rcgen = { version = "0.14", features = ["pem"] }
ring = "0.17"
base64 = "0.23"

# X.509 parsing (certificate expiry for renewal checks)
x509-parser = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for symlink-safe key/certificate writes
libc = "0.2"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio-test = "0.4"
# Pebble ACME test CA (Docker-gated end-to-end tests)
armature-testkit = { path = "../armature-testkit", features = ["containers"] }
# Certificate validity offsets in should_renew boundary tests
time = "0.3"
